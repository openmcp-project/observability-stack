components:
  - name: github.com/openmcp-project/observability-stack
    version: ${OBSERVABILITY_STACK_VERSION}
    provider:
      name: openmcp-project

    componentReferences:
      - componentName: github.com/openmcp-project/metrics-operator
        name: metrics-operator
        version: ${METRICS_OPERATOR_VERSION}

    resources:
      # kro resource graph definitions
      - name: resource-graph-definition
        type: blob
        input:
          type: File/v1
          path: tmp/rgd-merged.yaml

      # cert manager
      - name: cert-manager-chart
        version: ${CERT_MANAGER_VERSION}
        type: helmChart
        access:
          type: OCIImage/v1
          imageReference: "quay.io/jetstack/charts/cert-manager:${CERT_MANAGER_VERSION}"

      - name: cert-manager-controller-image
        version: ${CERT_MANAGER_VERSION}
        type: ociImage
        access:
          type: OCIImage/v1
          imageReference: "quay.io/jetstack/cert-manager-controller:${CERT_MANAGER_VERSION}"

      - name: cert-manager-webhook-image
        version: ${CERT_MANAGER_VERSION}
        type: ociImage
        access:
          type: OCIImage/v1
          imageReference: "quay.io/jetstack/cert-manager-webhook:${CERT_MANAGER_VERSION}"

      - name: cert-manager-cainjector-image
        version: ${CERT_MANAGER_VERSION}
        type: ociImage
        access:
          type: OCIImage/v1
          imageReference: "quay.io/jetstack/cert-manager-cainjector:${CERT_MANAGER_VERSION}"

      - name: cert-manager-acmesolver-image
        version: ${CERT_MANAGER_VERSION}
        type: ociImage
        access:
          type: OCIImage/v1
          imageReference: "quay.io/jetstack/cert-manager-acmesolver:${CERT_MANAGER_VERSION}"

      - name: cert-manager-startupapicheck-image
        version: ${CERT_MANAGER_VERSION}
        type: ociImage
        access:
          type: OCIImage/v1
          imageReference: "quay.io/jetstack/cert-manager-startupapicheck:${CERT_MANAGER_VERSION}"

      # open telemetry operator
      - name: open-telemetry-operator-chart
        version: ${OPEN_TELEMETRY_OPERATOR_CHART_VERSION}
        type: helmChart
        access:
          type: OCIImage/v1
          imageReference: "ghcr.io/open-telemetry/opentelemetry-helm-charts/opentelemetry-operator:${OPEN_TELEMETRY_OPERATOR_CHART_VERSION}"

      - name: open-telemetry-operator-image
        version: ${OPEN_TELEMETRY_OPERATOR_IMAGE_VERSION}
        type: ociImage
        access:
          type: OCIImage/v1
          imageReference: "ghcr.io/open-telemetry/opentelemetry-operator/opentelemetry-operator:${OPEN_TELEMETRY_OPERATOR_IMAGE_VERSION}"

      # open telemetry collector
      - name: open-telemetry-collector-kustomization
        version: ${OBSERVABILITY_STACK_VERSION}
        type: kustomization
        access:
          type: OCIImage/v1
          imageReference: "${KUSTOMIZATIONS_LOCATION_PREFIX}/open-telemetry-collector:${OBSERVABILITY_STACK_VERSION}"

      - name: open-telemetry-collector-image
        version: ${OPEN_TELEMETRY_COLLECTOR_IMAGE_VERSION}
        type: ociImage
        access:
          type: OCIImage/v1
          imageReference: "docker.io/otel/opentelemetry-collector-contrib:${OPEN_TELEMETRY_COLLECTOR_IMAGE_TAG}"

      # open telemetry collector resource chart
      - name: open-telemetry-collector-resource-chart
        version: ${OBSERVABILITY_STACK_VERSION}
        type: helmChart
        input:
          type: Helm/v1
          path: charts/open-telemetry-collector-resource
          repository: charts/open-telemetry-collector-resource:${OBSERVABILITY_STACK_VERSION}

      # prometheus operator
      - name: prometheus-operator-kustomization
        version: ${OBSERVABILITY_STACK_VERSION}
        type: kustomization
        access:
          type: OCIImage/v1
          imageReference: "${KUSTOMIZATIONS_LOCATION_PREFIX}/prometheus-operator:${OBSERVABILITY_STACK_VERSION}"

      - name: prometheus-operator-image
        version: ${PROMETHEUS_OPERATOR_IMAGE_VERSION}
        type: ociImage
        access:
          type: OCIImage/v1
          imageReference: "quay.io/prometheus-operator/prometheus-operator:${PROMETHEUS_OPERATOR_IMAGE_VERSION}"

      - name: prometheus-operator-config-reloader-image
        version: ${PROMETHEUS_OPERATOR_CONFIG_RELOADER_IMAGE_VERSION}
        type: ociImage
        access:
          type: OCIImage/v1
          imageReference: "quay.io/prometheus-operator/prometheus-config-reloader:${PROMETHEUS_OPERATOR_CONFIG_RELOADER_IMAGE_VERSION}"

      # prometheus
      - name: prometheus-kustomization
        version: ${OBSERVABILITY_STACK_VERSION}
        type: kustomization
        access:
          type: OCIImage/v1
          imageReference: "${KUSTOMIZATIONS_LOCATION_PREFIX}/prometheus:${OBSERVABILITY_STACK_VERSION}"

      - name: prometheus-image
        version: ${PROMETHEUS_OPERATOR_IMAGE_VERSION}
        type: ociImage
        access:
          type: OCIImage/v1
          imageReference: "quay.io/prometheus/prometheus:${PROMETHEUS_IMAGE_VERSION}"

      - name: alertmanager-image
        version: ${ALERTMANAGER_IMAGE_VERSION}
        type: ociImage
        access:
          type: OCIImage/v1
          imageReference: "quay.io/prometheus/alertmanager:${ALERTMANAGER_IMAGE_VERSION}"

      # metrics
      - name: metrics-kustomization
        version: ${OBSERVABILITY_STACK_VERSION}
        type: kustomization
        access:
          type: OCIImage/v1
          imageReference: "${KUSTOMIZATIONS_LOCATION_PREFIX}/metrics:${OBSERVABILITY_STACK_VERSION}"

      # observability gateway
      - name: observability-gateway-kustomization
        version: ${OBSERVABILITY_STACK_VERSION}
        type: kustomization
        access:
          type: OCIImage/v1
          imageReference: "${KUSTOMIZATIONS_LOCATION_PREFIX}/observability-gateway:${OBSERVABILITY_STACK_VERSION}"

      # victoria logs
      - name: victoria-logs-kustomization
        version: ${OBSERVABILITY_STACK_VERSION}
        type: kustomization
        access:
          type: OCIImage/v1
          imageReference: "${KUSTOMIZATIONS_LOCATION_PREFIX}/victoria-logs:${OBSERVABILITY_STACK_VERSION}"

      - name: victoria-logs-image
        version: ${VICTORIA_LOGS_IMAGE_VERSION}
        type: ociImage
        access:
          type: OCIImage/v1
          imageReference: "docker.io/victoriametrics/victoria-logs:${VICTORIA_LOGS_IMAGE_VERSION}"

