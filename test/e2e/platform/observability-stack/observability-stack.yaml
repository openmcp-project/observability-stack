apiVersion: kro.run/v1alpha1
kind: ObservabilityStack
metadata:
  name: stack
  namespace: obs-stack
spec:
  componentRef:
    name: obs-stack-component
  imagePullSecretRef:
    name: regcred
    namespace: obs-stack
  certManager:
    namespace: cert-manager-system
  metricsOperator:
    namespace: metrics-operator-system
  metrics:
    namespace: metrics-operator-system
  openTelemetryOperator:
    namespace: open-telemetry-operator-system
  openTelemetryCollector:
    namespace: open-telemetry-collector-system
    clusterName: platform
  prometheusOperator:
    namespace: prometheus-operator-system
  prometheus:
    namespace: prometheus-system
  victoriaLogs:
    namespace: victoria-logs-system
    retentionPeriod: "1d"
    storage: "128Mi"
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "1Gi"
        cpu: "500m"
  observabilityGateway:
    namespace: observability-gateway-system
    port: 8443
