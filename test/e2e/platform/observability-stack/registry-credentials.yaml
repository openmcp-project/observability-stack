apiVersion: v1
kind: Secret
metadata:
  name: regcred
  namespace: obs-stack
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "username": "{{.GITHUB_USERNAME}}",
          "password": "{{.GITHUB_TOKEN}}",
          "auth": ""
        }
      }
    }
