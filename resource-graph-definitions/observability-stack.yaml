apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: obs-stack
spec:
  schema:
    apiVersion: v1alpha1
    kind: ObservabilityStack
    spec:
      componentRef:
        name: string | default="obs-stack-component"
      imagePullSecretRef:
        name: string | default="imgpull"
        namespace: string | default="obs-stack"
      openMCPGatewayRef:
        name: string | default="default"
        namespace: string | default="openmcp-system"
      certManager:
        namespace: string | default="cert-manager-system"
      metricsOperator:
        namespace: string | default="metrics-operator-system"
        resources:
          requests:
            memory: string | default="64Mi"
            cpu: string | default="10m"
          limits:
            memory: string | default="128Mi"
            cpu: string | default="100m"
      metrics:
        namespace: string | default="metrics-operator-system"
      openTelemetryOperator:
        namespace: string | default="open-telemetry-operator-system"
      openTelemetryCollector:
        namespace: string | default="open-telemetry-collector-system"
        clusterName: string | default=""
        resources:
          requests:
            memory: string | default="256Mi"
            cpu: string | default="100m"
          limits:
            memory: string | default="512Mi"
            cpu: string | default="500m"
        logCollectorResources:
          requests:
            memory: string | default="128Mi"
            cpu: string | default="50m"
          limits:
            memory: string | default="256Mi"
            cpu: string | default="200m"
      prometheusOperator:
        namespace: string | default="prometheus-operator-system"
      prometheus:
        namespace: string | default="prometheus-system"
        storage: string | default="10Gi"
        resources:
          requests:
            memory: string | default="400Mi"
            cpu: string | default="100m"
          limits:
            memory: string | default="2Gi"
            cpu: string | default="1000m"
      victoriaLogs:
        namespace: string | default="victoria-logs-system"
        retentionPeriod: string | default="7d"
        storage: string | default="10Gi"
        resources:
          requests:
            memory: string | default="256Mi"
            cpu: string | default="100m"
          limits:
            memory: string | default="1Gi"
            cpu: string | default="500m"
      observabilityGateway:
        namespace: string | default="observability-gateway-system"
        port: integer | default=8443
        clientCertCommonName: string | default="observability-client"
    status:
      certManager:
        ready: ${certManager.status.ready}
      metricsOperator:
        ready: ${metricsOperator.status.ready}
      metrics:
        ready: ${metrics.status.ready}
      openTelemetryOperator:
        ready: ${openTelemetryOperator.status.ready}
      openTelemetryCollector:
        ready: ${openTelemetryCollector.status.ready}
      prometheusOperator:
        ready: ${prometheusOperator.status.ready}
      prometheus:
        ready: ${prometheus.status.ready}
      victoriaLogs:
        ready: ${victoriaLogs.status.ready}
      observabilityGateway:
        ready: ${observabilityGateway.status.ready}
      remoteObservability:
        ready: ${remoteObservability.status.ready}
      ready: |-
        ${
          (certManager.status.ready == true) && 
          (metricsOperator.status.ready == true) && 
          (openTelemetryOperator.status.ready == true) && 
          (prometheusOperator.status.ready == true) && 
          (prometheus.status.ready == true) && 
          (openTelemetryCollector.status.ready == true) && 
          (metrics.status.ready == true) && 
          (victoriaLogs.status.ready == true) && 
          (observabilityGateway.status.ready == true) && 
          (remoteObservability.status.ready == true)
        }

  resources:
    - id: certManager
      template:
        apiVersion: kro.run/v1alpha1
        kind: CertManager
        metadata:
          name: cert-manager
        spec:
          componentRef: ${schema.spec.componentRef}
          imagePullSecretRef: ${schema.spec.imagePullSecretRef}
          forProvider: ${schema.spec.certManager}
      readyWhen:
        - ${certManager.status.ready == true}

    - id: observabilityGateway
      template:
        apiVersion: kro.run/v1alpha1
        kind: ObservabilityGateway
        metadata:
          name: observability-gateway
          annotations:
            dependency/cert-manager: ${certManager.status.lastAttemptedRevisionDigest}
        spec:
          componentRef: ${schema.spec.componentRef}
          imagePullSecretRef: ${schema.spec.imagePullSecretRef}
          openMCPGatewayRef: ${schema.spec.openMCPGatewayRef}
          forProvider:
            namespace: ${schema.spec.observabilityGateway.namespace}
            port: ${schema.spec.observabilityGateway.port}
            clientCertCommonName: ${schema.spec.observabilityGateway.clientCertCommonName}
      readyWhen:
        - ${observabilityGateway.status.ready == true}

    - id: metricsOperator
      template:
        apiVersion: kro.run/v1alpha1
        kind: MetricsOperator
        metadata:
          name: metrics-operator
        spec:
          componentRef: ${schema.spec.componentRef}
          imagePullSecretRef: ${schema.spec.imagePullSecretRef}
          forProvider: ${schema.spec.metricsOperator}
      readyWhen:
        - ${metricsOperator.status.ready == true}

    - id: metrics
      template:
        apiVersion: kro.run/v1alpha1
        kind: OpenMCPMetric
        metadata:
          name: openmcp-metrics
          annotations:
            dependency/prometheus-operator: ${prometheusOperator.status.lastAttemptedRevisionDigest}
            dependency/metrics-operator: ${metricsOperator.status.lastAttemptedRevisionDigest}
        spec:
          componentRef: ${schema.spec.componentRef}
          imagePullSecretRef: ${schema.spec.imagePullSecretRef}
          openTelemetryCollector: ${schema.spec.openTelemetryCollector}
          forProvider: ${schema.spec.metrics}
      readyWhen:
        - ${metrics.status.ready == true}

    - id: prometheusOperator
      template:
        apiVersion: kro.run/v1alpha1
        kind: PrometheusOperator
        metadata:
          name: prometheus-operator
        spec:
          componentRef: ${schema.spec.componentRef}
          imagePullSecretRef: ${schema.spec.imagePullSecretRef}
          forProvider: ${schema.spec.prometheusOperator}
      readyWhen:
        - ${prometheusOperator.status.ready == true}

    - id: prometheus
      template:
        apiVersion: kro.run/v1alpha1
        kind: Prometheus
        metadata:
          name: prometheus
          annotations:
            dependency/observability-gateway: ${observabilityGateway.status.lastAttemptedRevisionDigest}
            dependency/prometheus-operator: ${prometheusOperator.status.lastAttemptedRevisionDigest}
        spec:
          componentRef: ${schema.spec.componentRef}
          imagePullSecretRef: ${schema.spec.imagePullSecretRef}
          openMCPGatewayRef: ${schema.spec.openMCPGatewayRef}
          observabilityGatewayRef:
            namespace: ${schema.spec.observabilityGateway.namespace}
          forProvider: ${schema.spec.prometheus}
      readyWhen:
        - ${prometheus.status.ready == true}

    - id: openTelemetryOperator
      template:
        apiVersion: kro.run/v1alpha1
        kind: OpenTelemetryOperator
        metadata:
          name: open-telemetry-operator
          annotations:
            dependency/cert-manager: ${certManager.status.lastAttemptedRevisionDigest}
        spec:
          componentRef: ${schema.spec.componentRef}
          imagePullSecretRef: ${schema.spec.imagePullSecretRef}
          forProvider: ${schema.spec.openTelemetryOperator}
      readyWhen:
        - ${openTelemetryOperator.status.ready == true}

    - id: openTelemetryCollector
      template:
        apiVersion: kro.run/v1alpha1
        kind: OpenTelemetryCollector
        metadata:
          name: open-telemetry-collector
          annotations:
            dependency/prometheus-operator: ${prometheusOperator.status.lastAttemptedRevisionDigest}
            dependency/open-telemetry-operator: ${openTelemetryOperator.status.lastAttemptedRevisionDigest}
        spec:
          componentRef: ${schema.spec.componentRef}
          imagePullSecretRef: ${schema.spec.imagePullSecretRef}
          forProvider: ${schema.spec.openTelemetryCollector}
      readyWhen:
        - ${openTelemetryCollector.status.ready == true}

    - id: victoriaLogs
      template:
        apiVersion: kro.run/v1alpha1
        kind: VictoriaLogs
        metadata:
          name: victoria-logs
          annotations:
            dependency/observability-gateway: ${observabilityGateway.status.lastAttemptedRevisionDigest}
        spec:
          componentRef: ${schema.spec.componentRef}
          imagePullSecretRef: ${schema.spec.imagePullSecretRef}
          openMCPGatewayRef: ${schema.spec.openMCPGatewayRef}
          observabilityGatewayRef:
            namespace: ${schema.spec.observabilityGateway.namespace}
          forProvider: ${schema.spec.victoriaLogs}
      readyWhen:
        - ${victoriaLogs.status.ready == true}

    - id: remoteObservability
      template:
        apiVersion: kro.run/v1alpha1
        kind: RemoteObservability
        metadata:
          name: remote-observability
          annotations:
            dependency/cert-manager: ${certManager.status.lastAttemptedRevisionDigest}
            dependency/observability-gateway: ${observabilityGateway.status.lastAttemptedRevisionDigest}
            dependency/victoria-logs: ${victoriaLogs.status.lastAttemptedRevisionDigest}
        spec:
          componentRef: ${schema.spec.componentRef}
          imagePullSecretRef: ${schema.spec.imagePullSecretRef}
          gateway:
            namespace: ${schema.spec.observabilityGateway.namespace}
      readyWhen:
        - ${remoteObservability.status.ready == true}
