apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flux-kustomization-alerts
  labels:
    prometheus: prometheus
    app: prometheus
spec:
  groups:
    - name: flux.kustomization
      interval: 30s
      rules:
        - alert: KustomizationNotReady
          expr: |
            opencontrolplane_kustomization{kust_ready_status=~"False|Unknown"}
          for: 5m
          labels:
            severity: warning
            component: flux
          annotations:
            summary: "Kustomization {{ $labels.obj_name }} is not ready"
            description: "Kustomization {{ $labels.obj_name }} in namespace {{ $labels.obj_namespace }} on cluster {{ $labels.cluster }} has not been ready for 5 minutes."

        - alert: KustomizationNotHealthy
          expr: |
            opencontrolplane_kustomization{kust_healthy_status="False"}
          for: 5m
          labels:
            severity: warning
            component: flux
          annotations:
            summary: "Kustomization {{ $labels.obj_name }} is not healthy"
            description: "Kustomization {{ $labels.obj_name }} in namespace {{ $labels.obj_namespace }} on cluster {{ $labels.cluster }} is not healthy."