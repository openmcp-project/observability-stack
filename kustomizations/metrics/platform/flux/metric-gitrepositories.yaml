apiVersion: metrics.openmcp.cloud/v1alpha1
kind: Metric
metadata:
  name: gitrepository
spec:
  name: opencontrolplane_gitrepository
  description: FluxCD GitRepository
  target:
    kind: GitRepository
    group: source.toolkit.fluxcd.io
    version: v1
  interval: "1m"
  dataSinkRef:
    name: default
  projections:
    - name: gr_namespace
      fieldPath: "metadata.namespace"
      type: primitive

    - name: gr_name
      fieldPath: "metadata.name"
      type: primitive

    - name: gr_ready_status
      fieldPath: "status.conditions[?(@.type=='Ready')].status"
      type: primitive
      default: Unknown
