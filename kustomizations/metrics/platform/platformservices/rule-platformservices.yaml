apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: open-control-plane-platformservices-alerts
  labels:
    prometheus: prometheus
    app: prometheus
spec:
  groups:
    - name: open-control-plane.platformservice
      interval: 30s
      rules:
        - alert: PlatformServicePhaseNotReady
          expr: |
            opencontrolplane_platformservice{ps_phase!="Ready"}
          for: 5m
          labels:
            severity: warning
            component: deployment
          annotations:
            summary: "PlatformService {{ $labels.obj_name }} is not in phase Ready"
            description: "PlatformService {{ $labels.obj_name }} on cluster {{ $labels.cluster }} is not in phase Ready."
