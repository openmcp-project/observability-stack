apiVersion: metrics.openmcp.cloud/v1alpha1
kind: Metric
metadata:
  name: deployments
spec:
  name: co_k8s_deployments
  description: Kubernetes Deployments
  target:
    kind: Deployment
    group: apps
    version: v1
  interval: "1m"
  dataSinkRef:
    name: default
  projections:
    - name: dep_name
      fieldPath: "metadata.name"
      type: primitive

    - name: dep_namespace
      fieldPath: "metadata.namespace"
      type: primitive

    - name: dep_readyReplicas
      fieldPath: "status.readyReplicas"
      type: primitive
      default: "0"

    - name: dep_replicas
      fieldPath: "status.replicas"
      type: primitive
      default: "0"
