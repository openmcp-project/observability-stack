apiVersion: metrics.open-control-plane.io/v1alpha1
kind: Metric
metadata:
  name: e2e-testruns
spec:
  name: opencontrolplane_e2e_testruns
  description: open-control-plane E2E Test Runs
  target:
    kind: E2ETestRun
    group: test-runner.openmcp.cloud
    version: v1alpha1
  interval: "1m"
  dataSinkRef:
    name: default
  valueFrom:
    fieldPath: "metadata.creationTimestamp"
    type: timestamp
  projections:
    - name: obj_name
      fieldPath: "metadata.name"
      type: primitive

    - name: tr_spec_runner_version
      fieldPath: "spec.runner.version"
      type: primitive
      default: Unknown

    - name: tr_tc_create_project_run_status
      fieldPath: "status.testCases[?(@.name=='createProject')].conditions[?(@.type=='RunCompleted')].status"
      type: primitive
      default: Unknown

    - name: tr_tc_create_project_run_reason
      fieldPath: "status.testCases[?(@.name=='createProject')].conditions[?(@.type=='RunCompleted')].reason"
      type: primitive
      default: Unknown

    - name: tr_tc_create_project_cleanup_status
      fieldPath: "status.testCases[?(@.name=='createProject')].conditions[?(@.type=='CleanupCompleted')].status"
      type: primitive
      default: Unknown

    - name: tr_tc_create_project_cleanup_reason
      fieldPath: "status.testCases[?(@.name=='createProject')].conditions[?(@.type=='CleanupCompleted')].reason"
      type: primitive
      default: Unknown

    - name: tr_tc_create_workspace_run_status
      fieldPath: "status.testCases[?(@.name=='createWorkspace')].conditions[?(@.type=='RunCompleted')].status"
      type: primitive
      default: Unknown

    - name: tr_tc_create_workspace_run_reason
      fieldPath: "status.testCases[?(@.name=='createWorkspace')].conditions[?(@.type=='RunCompleted')].reason"
      type: primitive
      default: Unknown

    - name: tr_tc_create_workspace_cleanup_status
      fieldPath: "status.testCases[?(@.name=='createWorkspace')].conditions[?(@.type=='CleanupCompleted')].status"
      type: primitive
      default: Unknown

    - name: tr_tc_create_workspace_cleanup_reason
      fieldPath: "status.testCases[?(@.name=='createWorkspace')].conditions[?(@.type=='CleanupCompleted')].reason"
      type: primitive
      default: Unknown

    - name: tr_tc_create_controlplane_run_status
      fieldPath: "status.testCases[?(@.name=='createControlPlane')].conditions[?(@.type=='RunCompleted')].status"
      type: primitive
      default: Unknown

    - name: tr_tc_create_controlplane_run_reason
      fieldPath: "status.testCases[?(@.name=='createControlPlane')].conditions[?(@.type=='RunCompleted')].reason"
      type: primitive
      default: Unknown

    - name: tr_tc_create_controlplane_cleanup_status
      fieldPath: "status.testCases[?(@.name=='createControlPlane')].conditions[?(@.type=='CleanupCompleted')].status"
      type: primitive
      default: Unknown

    - name: tr_tc_create_controlplane_cleanup_reason
      fieldPath: "status.testCases[?(@.name=='createControlPlane')].conditions[?(@.type=='CleanupCompleted')].reason"
      type: primitive
      default: Unknown

    # createService produces N dynamically-named test cases ("createService/<Kind>") per run.
    # The metrics operator emits one series per E2ETestRun and the k8s jsonpath engine supports
    # neither regex (=~) nor nested/compound filters, so a fixed column per service is impossible.
    # Instead we aggregate RunCompleted/CleanupCompleted statuses across ALL test cases into a
    # slice label (JSON array, e.g. ["True","True","False"]); the alert rule regex-matches "False".
    - name: tr_all_run_statuses
      fieldPath: "status.testCases[*].conditions[?(@.type=='RunCompleted')].status"
      type: slice
      default: "[]"

    - name: tr_all_cleanup_statuses
      fieldPath: "status.testCases[*].conditions[?(@.type=='CleanupCompleted')].status"
      type: slice
      default: "[]"

