apiVersion: metrics.open-control-plane.io/v1alpha1
kind: Metric
metadata:
  name: serviceprovider
spec:
  name: opencontrolplane_serviceprovider
  description: open-control-plane Service Providers
  target:
    kind: ServiceProvider
    group: openmcp.cloud
    version: v1alpha1
  interval: "1m"
  dataSinkRef:
    name: default
  projections:
    - name: obj_name
      fieldPath: "metadata.name"
      type: primitive

    - name: sp_phase
      fieldPath: "status.phase"
      type: primitive
      default: Unknown


