apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: open-control-plane-landscaper-alerts
  labels:
    prometheus: prometheus
    app: prometheus
spec:
  groups:
    - name: open-control-plane.landscaper
      interval: 30s
      rules:
        - alert: LandscaperPhaseNotReady
          expr: |
            ocp_landscaper{ls_phase!="Ready"}
          for: 30m
          labels:
            severity: warning
            component: landscaper
            inhibit_alert: "true"
          annotations:
            summary: "Landscaper {{ $labels.ls_name }} in namespace {{ $labels.ls_namespace }} is not in phase Ready"
            description: "Landscaper {{ $labels.ls_name }} in namespace {{ $labels.ls_namespace }} on cluster {{ $labels.cluster }} is not in phase Ready."
