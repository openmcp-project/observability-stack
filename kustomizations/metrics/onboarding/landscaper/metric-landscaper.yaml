apiVersion: metrics.openmcp.cloud/v1alpha1
kind: FederatedMetric
metadata:
  name: landscaper
spec:
  name: opencontrolplane_landscaper
  description: Landscaper Service Provider Metrics
  target:
    kind: Landscaper
    group: landscaper.services.open-control-plane.io
    version: v1alpha2
  interval: "1m"
  dataSinkRef:
    name: default
  projections:
    - name: obj_namespace
      fieldPath: "metadata.namespace"
      type: primitive

    - name: obj_name
      fieldPath: "metadata.name"
      type: primitive

    - name: ls_phase
      fieldPath: "status.phase"
      type: primitive
      default: Unknown

  federateClusterAccessRef:
    name: onboarding-cluster
    namespace: NAMESPACE_PLACEHOLDER
