apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victoria-logs-otlp
spec:
  parentRefs:
  - name: observability-gateway
    namespace: observability-gateway-system
    sectionName: otlp-logs
  hostnames: []
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /insert
    backendRefs:
    - name: victoria-logs
      port: 9428
