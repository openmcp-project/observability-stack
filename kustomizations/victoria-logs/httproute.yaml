apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victoria-logs
spec:
  parentRefs:
  - name: observability-gateway
    namespace: observability-gateway-system
    sectionName: victoria-logs
  hostnames: []
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: victoria-logs
      port: 9428
