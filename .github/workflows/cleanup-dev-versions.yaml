name: Cleanup Old Dev Versions

# This workflow removes old dev versions from the container registry
# It runs weekly and deletes versions older than 30 days that match the patterns:
# - PR versions: <version>-pr<number>-<sha> (e.g., v0.0.3-pr123-abc1234)
# - Main branch dev versions: <version>-dev-<sha> (e.g., v0.0.3-dev-abc1234)

on:
  schedule:
    # Run every Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allow manual triggering

permissions:
  packages: write # to delete old package versions
  contents: read

jobs:
  cleanup:
    name: Cleanup Old Dev Versions
    runs-on: ubuntu-latest
    steps:
      - name: Delete old PR and dev versions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const packageName = 'components/component-descriptors/github.com/openmcp-project/observability-stack';
            const daysToKeep = 30;
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - daysToKeep);

            console.log(`Cleaning up dev versions older than ${cutoffDate.toISOString()}`);

            // Get all package versions across all pages
            let versions = [];
            try {
              for (let page = 1; ; page++) {
                const response = await github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg({
                  package_type: 'container',
                  package_name: packageName,
                  org: context.repo.owner,
                  per_page: 100,
                  page: page,
                  state: 'active'
                });
                if (response.data.length === 0) break;
                versions = versions.concat(response.data);
              }
            } catch (error) {
              if (error.status === 404) {
                console.log('Package not found. This is expected if no versions have been published yet.');
                return;
              }
              throw error;
            }

            console.log(`Found ${versions.length} total versions`);

            // Filter for dev versions (PR and main branch) older than cutoff date
            const devVersionsToDelete = versions.filter(version => {
              // Check if this is a dev version (contains -pr or -dev)
              const isDevVersion = version.metadata?.container?.tags?.some(tag =>
                tag.match(/-pr\d+-[a-f0-9]+$/) || tag.match(/-dev-[a-f0-9]+$/)
              );

              if (!isDevVersion) {
                return false;
              }

              // Check if older than cutoff
              const createdAt = new Date(version.created_at);
              return createdAt < cutoffDate;
            });

            console.log(`Found ${devVersionsToDelete.length} dev versions to delete`);

            // Delete old dev versions
            for (const version of devVersionsToDelete) {
              const tags = version.metadata?.container?.tags || [];
              console.log(`Deleting version ${version.id} (tags: ${tags.join(', ')}) created at ${version.created_at}`);

              try {
                await github.rest.packages.deletePackageVersionForOrg({
                  package_type: 'container',
                  package_name: packageName,
                  org: context.repo.owner,
                  package_version_id: version.id
                });
                console.log(`  ✓ Deleted successfully`);
              } catch (error) {
                console.log(`  ✗ Failed to delete: ${error.message}`);
              }
            }

            console.log('Cleanup completed!');
