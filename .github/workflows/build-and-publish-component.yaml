name: Build and Publish OCM Component

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2
        id: app-token
        with:
          # required
          app-id: 1312871
          private-key: ${{ secrets.OPENMCP_CI_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-tags: true
          fetch-depth: 0
          submodules: recursive

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up OCM CLI
        uses: open-component-model/ocm-setup-action@v1

      - name: Set up Flux CLI
        uses: fluxcd/flux2/action@main

      - name: Build OCM component
        run: |
          ./hack/build-component.sh

      - name: Push OCM component
        run: |
          ./hack/push-component.sh

      - name: Prepare next development version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Extract current version from tag (e.g., v1.0.0)
          CURRENT_VERSION="${GITHUB_REF#refs/tags/}"
          echo "Current release version: $CURRENT_VERSION"

          # Append -dev to current version
          NEXT_VERSION="${CURRENT_VERSION}-dev"

          echo "Next development version: $NEXT_VERSION"
          echo "$NEXT_VERSION" > VERSION

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Commit and push changes to main branch
          git checkout main
          git add VERSION
          git commit -m "chore: prepare next development version $NEXT_VERSION"
          git push origin main
